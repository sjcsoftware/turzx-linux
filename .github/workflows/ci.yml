name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 fonts-dejavu-core fontconfig
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Presets are up to date
        run: |
          python tools/make_presets.py
          git diff --exit-code src/turzx/presets
      - name: Tests
        run: pytest -q
